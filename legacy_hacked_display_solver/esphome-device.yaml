display:
  - platform: ssd1351_spi # VCC 3 or 5: 3V
    model: "SSD1351 128x128"
    reset_pin: GPIO16 # RESET of display
    cs_pin: GPIO21 # CS of display
    dc_pin: GPIO17 # DC of display
    update_interval: 2500ms
    lambda: |-
          if(id(g_dg_error)) {
            it.rectangle(0, 60, 128, 10, id(my_red));
          }
          switch (id(page)){
            case 1:
              for(int i = 0 ; i < id(g_dg_draw_shape).size(); i++) {
                auto scol = Color(id(g_dg_draw_shape_r)[i], id(g_dg_draw_shape_g)[i], id(g_dg_draw_shape_b)[i]);

                if (id(g_dg_draw_shape)[i] == "rectangle") { 
                  it.rectangle(id(g_dg_draw_shape_x)[i], id(g_dg_draw_shape_y)[i], id(g_dg_draw_shape_d2)[i], id(g_dg_draw_shape_d3)[i], scol);
                } else if (id(g_dg_draw_shape)[i] == "filled_rectangle") { 
                  it.filled_rectangle(id(g_dg_draw_shape_x)[i], id(g_dg_draw_shape_y)[i], id(g_dg_draw_shape_d2)[i], id(g_dg_draw_shape_d3)[i], scol);
                } else if (id(g_dg_draw_shape)[i] == "circle") { 
                  it.circle(id(g_dg_draw_shape_x)[i], id(g_dg_draw_shape_y)[i], id(g_dg_draw_shape_d2)[i], scol);
                } else if (id(g_dg_draw_shape)[i] == "filled_circle") { 
                  it.filled_circle(id(g_dg_draw_shape_x)[i], id(g_dg_draw_shape_y)[i], id(g_dg_draw_shape_d2)[i], scol);
                }
              }

              auto font = id(icon_font4);
              if (id(g_dg_glyph_font) == 4) {
                font = id(icon_font4);
              } else if (id(g_dg_glyph_font) == 3) {
                font = id(icon_font3);
              } else if (id(g_dg_glyph_font) == 2) {
                font = id(icon_font2);
              } else if (id(g_dg_glyph_font) <= 1) {
                font = id(icon_font1);
              }
              for(int i = 0 ; i < id(g_dg_glyph).size(); i++) {
                it.print(id(g_dg_x)[i], id(g_dg_y)[i], font, Color(id(g_dg_r)[i], id(g_dg_g)[i], id(g_dg_b)[i]), id(g_dg_glyph)[i].c_str());
              }
              // info handling
              auto info_glyph_font = id(icon_font4);
              if (id(g_dg_info_glyph_font) == 4) {
                info_glyph_font = id(icon_font4);
              } else if (id(g_dg_info_glyph_font) == 3) {
                info_glyph_font = id(icon_font3);
              } else if (id(g_dg_info_glyph_font) == 2) {
                info_glyph_font = id(icon_font2);
              } else if (id(g_dg_info_glyph_font) <= 1) {
                info_glyph_font = id(icon_font1);
              }

              int info_i = id(g_dg_info_index);
              if (id(g_dg_info_text).size() <= id(g_dg_info_text_y).size()) {
                info_i = 0;
              }
              int info_last = info_i;
              int info_rows = id(g_dg_info_text_y).size();
              for(int i = 0; i < info_rows; i++) {
                if(info_i >= id(g_dg_info_text).size()) { info_i = 0; }
                it.print(id(g_dg_info_text_x)[i], id(g_dg_info_text_y)[i], id(roboto),
                 Color(id(g_dg_info_text_r)[info_i], id(g_dg_info_text_g)[info_i], id(g_dg_info_text_b)[info_i]),
                 id(g_dg_info_text)[info_i].c_str());
                it.print(id(g_dg_info_glyph_x)[i], id(g_dg_info_glyph_y)[i], info_glyph_font,
                 Color(id(g_dg_info_glyph_r)[info_i], id(g_dg_info_glyph_g)[info_i], id(g_dg_info_glyph_b)[info_i]),
                 id(g_dg_info_glyph)[info_i].c_str());
                info_last = info_i;
                info_i++;
              }
              if(id(g_dg_info_scroll) and info_rows > 1) {
                  id(g_dg_info_index) = info_last;
              } else {
                  id(g_dg_info_index) = info_i;
              }
              break;
          }



interval:
- interval: 2s
  then:
    - lambda: |-
        id(page) = (id(page) + 1);
        if (id(page) > 1) {
          id(page) = 1;
        }

