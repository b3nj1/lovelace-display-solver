  - id: my_blue
    blue: 100%
  - id: my_red
    red: 100%
  - id: my_orange
    red: 100%
    green: 50%
  - id: my_green
    green: 100%
  - id: my_white
    red: 100%
    blue: 100%
    green: 100%
  - id: my_yellow
    hex: ffeeaa

