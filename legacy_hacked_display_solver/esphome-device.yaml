substitutions:
  name: living-room-iaq
  friendly_name: Living Room IAQ
esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# GPIO22 - Bad connection (burned solder joint)
# SGP30: is sensitive GPIO19, GPIO18 have had issues; maybe OK; other pins worked better after frequency: 10kHz

esp32:
  board: esp32dev
  framework:
    type: esp-idf # 2026-06 moved from arduino to esp-idf
    advanced: 
      minimum_chip_revision: "3.0" # smaller binaries


# Enable logging
logger:
  #level: WARN
  #level: ERROR
  logs:
    component: ERROR
    pmsx003: INFO # WARN
    sgp30: WARN
    sensor: WARN
    dht: WARN
    scd4x: WARN


# Tried BLE, but kept crashing
#OOM    esp32_ble_tracker: 
#OOM     bluetooth_proxy: 

ota:
  - platform: esphome
    password: "b1fc4f3e53a22f8b1493e6b480d9a9df"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Living-Room-Iaq Fallback Hotspot"
    password: "P6m5Y6M9z6s0"


captive_portal:

#web_server:



button:
  - platform: restart
    name: "Restart"

uart: # PMS5003 VCC 5V
  baud_rate: 9600
  tx_pin: GPIO14 # RX of PMS5003
  rx_pin: GPIO33 # TX of PMS5003

i2c: # SGP30 VCC 2-5V => #3.3
  sda: GPIO26 # SDA of SGP30
  scl: GPIO23 # SCL of SGP30
  scan: true
  frequency: 10kHz # try this to avoid "unknown setup issue"

sensor:
  - platform: uptime
    name: Uptime Sensor
    update_interval: 300s
    id: up_for
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 60s
  - platform: pmsx003
    type: PMSX003
    pm_1_0:
      name: "Particulate Matter <1.0µm Concentration"
    pm_2_5:
      id: pm_2_5
      name: "Particulate Matter <2.5µm Concentration"
    pm_10_0:
      name: "Particulate Matter <10.0µm Concentration"
    update_interval: 90s
  - platform: sgp30
    eco2:
      name: "eCO2"
      id: eco2
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 60
            send_every: 60
            send_first_at: 60
    tvoc:
      name: "TVOC"
      accuracy_decimals: 0
      filters:
        - sliding_window_moving_average:
            window_size: 60
            send_every: 60
            send_first_at: 60

    store_baseline: yes
    address: 0x58
    update_interval: 1s
    baseline:
      eco2_baseline: 0x8980
      tvoc_baseline: 0x9664
    eco2_baseline:
      name: "eCO2 baseline"
      accuracy_decimals: 0
      state_class: "measurement"

    tvoc_baseline:
      name: "TVOC baseline"
      accuracy_decimals: 0  
      state_class: "measurement"
    compensation:
      temperature_source: temperature
      humidity_source: humidity

  - platform: scd4x
    update_interval: 5s
    measurement_mode: periodic
    co2:
      name: "Carbon Dioxide"
      accuracy_decimals: 0
      filters:
        - skip_initial: 30
        - sliding_window_moving_average:
            window_size: 12
            send_every: 12
            send_first_at: 12
    temperature:
      name: "Temperature"
      id: temperature
      accuracy_decimals: 1
      filters:
        - skip_initial: 30
        - offset: -1.65
        - sliding_window_moving_average:
            window_size: 12
            send_every: 12
            send_first_at: 12

    humidity:
      name: "Humidity"
      id: humidity
      accuracy_decimals: 1
      filters:
        - skip_initial: 30
        - offset: +8
        - sliding_window_moving_average:
            window_size: 12
            send_every: 12
            send_first_at: 12

  
  # - platform: dht # VCC 3.3
  #   pin: GPIO13 # DHT Data
  #   model: AM2302
  #   temperature:
  #     name: "Temperature"
  #     id: dht_temperature
  #     filters:
  #       - offset: -2.25

  #   humidity:
  #     name: "Relative Humidity"
  #     id: dht_humidity
  #     filters:
  #       - offset: +3
  #   update_interval: 60s

