api:
  encryption:
    key: "5cxDJMUAXRsToe0h1M5AUqJ3rHmPW6Lw0Dr/3jnE5ps="
  services:
    - service: set_display_glyphs
      variables:
        x: int[]
        y: int[]
        r: int[]
        g: int[]
        b: int[]
        glyph: string[]
        glyph_font: int
        info_glyph_font: int
        info_glyph: string[]
        info_glyph_y: int[]
